<!DOCTYPE html><html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"><title>Tạo Key Beta</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --bg:#050609;
  --glass:rgba(255,255,255,.065);
  --glass2:rgba(255,255,255,.035);
  --stroke:rgba(255,255,255,.13);
  --stroke-soft:rgba(255,255,255,.07);
  --text:#f7f8fb;
  --muted:#9b9da7;
  --blue:#4b8dff;
  --blue2:#246bff;
  --green:#39dc7b;
  --red:#ff6868;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  font-family:
    "Plus Jakarta Sans",
    system-ui,
    sans-serif;

  color:var(--text);
  background:
    radial-gradient(
      600px 420px at 5% 0%,
      rgba(65,130,255,.18),
      transparent 68%
    ),
    radial-gradient(
      500px 380px at 100% 100%,
      rgba(0,190,255,.11),
      transparent 68%
    ),
    #050609;

  overflow-x:hidden;
}

/* =========================
   MOVING LIQUID LIGHT
========================= */

body::before,
body::after{
  content:"";
  position:fixed;
  pointer-events:none;
  border-radius:50%;
  filter:blur(35px);
  z-index:0;
}

body::before{
  width:320px;
  height:320px;
  left:-150px;
  top:-130px;

  background:
    radial-gradient(
      circle,
      rgba(80,145,255,.20),
      transparent 68%
    );

  animation:
    liquidOne 10s ease-in-out infinite;
}

body::after{
  width:340px;
  height:340px;
  right:-160px;
  bottom:-150px;

  background:
    radial-gradient(
      circle,
      rgba(0,205,255,.13),
      transparent 68%
    );

  animation:
    liquidTwo 12s ease-in-out infinite;
}

@keyframes liquidOne{
  0%,100%{
    transform:translate(0,0) scale(1);
  }
  50%{
    transform:translate(150px,110px) scale(1.18);
  }
}

@keyframes liquidTwo{
  0%,100%{
    transform:translate(0,0) scale(1);
  }
  50%{
    transform:translate(-130px,-100px) scale(1.15);
  }
}

/* =========================
   SHELL
========================= */

.shell{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:2;
}

/* =========================
   GLASS CARD
========================= */

.card{
  position:relative;
  overflow:hidden;

  padding:28px 22px 22px;

  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.032)
    );

  border:1px solid var(--stroke);

  backdrop-filter:
    blur(30px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(30px)
    saturate(155%);

  box-shadow:
    0 35px 90px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(255,255,255,.025);

  animation:
    cardIn .65s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.97);
  }
  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }
}

/* glass reflection */

.card::before{
  content:"";
  position:absolute;
  inset:-40%;

  background:
    linear-gradient(
      115deg,
      transparent 38%,
      rgba(255,255,255,.075) 48%,
      transparent 58%
    );

  transform:translateX(-65%) rotate(8deg);

  animation:
    glassShine 7s ease-in-out infinite;

  pointer-events:none;
}

@keyframes glassShine{
  0%,45%{
    transform:
      translateX(-65%)
      rotate(8deg);
  }

  70%,100%{
    transform:
      translateX(65%)
      rotate(8deg);
  }
}

/* =========================
   TOP ICON
========================= */

.top{
  position:relative;
  z-index:1;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.icon{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  font-size:21px;

  background:
    linear-gradient(
      145deg,
      rgba(80,145,255,.20),
      rgba(255,255,255,.045)
    );

  border:1px solid
    rgba(105,160,255,.22);

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.12),
    0 8px 28px
      rgba(45,110,255,.12);
}

.live{
  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 10px;

  border-radius:999px;

  color:#a9caff;

  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;

  background:
    rgba(59,130,246,.08);

  border:1px solid
    rgba(80,145,255,.18);
}

.live-dot{
  width:6px;
  height:6px;
  border-radius:50%;

  background:#61a1ff;

  box-shadow:
    0 0 10px
    rgba(80,150,255,.9);

  animation:pulse 1.8s ease-in-out infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:.45;
    transform:scale(.8);
  }
  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

/* =========================
   TEXT
========================= */

.content{
  position:relative;
  z-index:1;
}

h1{
  font-size:25px;
  line-height:1.15;
  font-weight:800;
  letter-spacing:-.045em;
  margin-bottom:9px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  line-height:1.65;
  margin-bottom:22px;
}

.sub b{
  color:#dfeaff;
}

/* =========================
   MAIN BUTTON
========================= */

.btn{
  position:relative;
  width:100%;

  border:0;
  border-radius:16px;

  padding:15px 16px;

  font-family:inherit;
  font-size:13.5px;
  font-weight:800;

  color:white;

  cursor:pointer;

  overflow:hidden;

  transition:
    transform .18s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.btn::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.16),
      transparent 75%
    );

  transform:translateX(-100%);
  transition:transform .55s ease;
}

.btn:hover::before{
  transform:translateX(100%);
}

.btn:active{
  transform:scale(.975);
}

.btn:disabled{
  opacity:.48;
  cursor:not-allowed;
}

.btn-main{
  background:
    linear-gradient(
      135deg,
      #4d91ff,
      #286dff
    );

  box-shadow:
    0 12px 32px
      rgba(40,109,255,.28),
    inset 0 1px 0
      rgba(255,255,255,.20);
}

.btn-main:hover{
  box-shadow:
    0 15px 38px
      rgba(40,109,255,.40),
    inset 0 1px 0
      rgba(255,255,255,.22);
}

.btn-green{
  margin-top:9px;

  background:
    linear-gradient(
      135deg,
      #35d978,
      #19ae59
    );

  box-shadow:
    0 10px 28px
      rgba(30,200,100,.20);
}

.btn-ghost{
  margin-top:8px;

  color:#d8d9df;

  background:
    rgba(255,255,255,.045);

  border:1px solid
    rgba(255,255,255,.10);

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.06);
}

/* =========================
   STATUS
========================= */

.status-wrap{
  display:flex;
  align-items:center;
  gap:8px;

  margin-top:14px;
  min-height:22px;

  padding:0 2px;
}

.status-icon{
  width:7px;
  height:7px;
  flex:none;

  border-radius:50%;

  background:#f7c948;

  box-shadow:
    0 0 9px
    rgba(247,201,72,.55);
}

#status{
  color:#c7c8ce;

  font-size:11.5px;
  font-weight:600;

  white-space:pre-line;
  word-break:break-word;
}

#status.err{
  color:#ff8585;
}

#status.ok{
  color:#62e596;
}

/* =========================
   RESULT
========================= */

#result{
  display:none;

  margin-top:18px;
  padding-top:17px;

  border-top:1px solid
    rgba(255,255,255,.075);

  animation:
    resultIn .45s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.block{
  margin-bottom:15px;
}

.label{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:8px;

  color:#858894;

  font-size:9px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.label::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:#638fff;
  box-shadow:0 0 8px rgba(70,130,255,.7);
}

.box{
  min-height:48px;

  display:flex;
  align-items:center;

  padding:13px 14px;

  border-radius:15px;

  font-size:12px;
  font-weight:700;

  line-height:1.5;

  word-break:break-all;

  background:
    rgba(255,255,255,.035);

  border:1px solid
    rgba(255,255,255,.08);

  box-shadow:
    inset 0 1px 0
      rgba(255,255,255,.045);
}

.box.key{
  color:#83efa9;

  background:
    linear-gradient(
      135deg,
      rgba(35,210,110,.075),
      rgba(255,255,255,.025)
    );

  border-color:
    rgba(55,220,125,.22);
}

.box.link{
  color:#91c1ff;

  background:
    linear-gradient(
      135deg,
      rgba(60,130,255,.075),
      rgba(255,255,255,.025)
    );

  border-color:
    rgba(75,140,255,.22);
}

/* =========================
   FOOTER
========================= */

.foot{
  position:relative;
  z-index:1;

  margin-top:20px;

  color:#656872;

  text-align:center;

  font-size:10px;
  line-height:1.5;
}

.foot span{
  color:#8b8e98;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){
  body{
    padding:14px;
  }

  .card{
    padding:
      24px 18px 19px;
    border-radius:26px;
  }

  h1{
    font-size:22px;
  }
}
</style></head><body><div class="shell">  <div class="card"><div class="top">
  <div class="icon">🔑</div>

  <div class="live">
    <span class="live-dot"></span>
    Secure Key
  </div>
</div>

<div class="content">

  <h1>Tạo Key Beta</h1>

  <p class="sub">
    Tạo <b>Key dùng một lần</b> để sử dụng ứng dụng.
    Hoàn thành Link4M để nhận Key của bạn.
  </p>

  <button
    class="btn btn-main"
    id="btnCreate"
    onclick="createAll()"
  >
    Tạo Key Free
  </button>

  <div class="status-wrap">
    <span class="status-icon"></span>
    <div id="status">Sẵn sàng tạo Key...</div>
  </div>

  <div id="result">

    <div class="block">

      <div class="label">
        Key
      </div>

      <div
        class="box key"
        id="outKey"
      >
        Hoàn thành Link4M để nhận Key
      </div>

      <button
        class="btn btn-green"
        onclick="copyText('outKey')"
      >
        Sao chép Key
      </button>

    </div>

    <div class="block">

      <div class="label">
        Link4M
      </div>

      <div
        class="box link"
        id="outLink"
      >
        —
      </div>

      <button
        class="btn btn-main"
        onclick="openLink()"
      >
        Mở Link4M
      </button>

      <button
        class="btn btn-ghost"
        onclick="copyText('outLink')"
      >
        Sao chép Link4M
      </button>

    </div>

  </div>

</div>

<p class="foot">
  <span>One-time Key System</span>
  · LoveMeizu
</p>

  </div></div><script>

const BACKEND_URL =
  "https://meizulover-key-backend.onrender.com";


function setStatus(msg, type){

  const el =
    document.getElementById("status");

  el.textContent = msg;
  el.className = type || "";

}


function copyText(id){

  const el =
    document.getElementById(id);

  const text =
    el.textContent.trim();

  if(!text || text === "—"){
    return;
  }

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    navigator.clipboard
      .writeText(text)
      .then(function(){

        setStatus(
          "Đã sao chép!",
          "ok"
        );

      })
      .catch(function(){

        fallbackCopy(text);

      });

    return;
  }

  fallbackCopy(text);
}


function fallbackCopy(text){

  const ta =
    document.createElement("textarea");

  ta.value = text;

  document.body.appendChild(ta);

  ta.select();

  try{

    document.execCommand("copy");

    setStatus(
      "Đã sao chép!",
      "ok"
    );

  }catch(e){

    alert(text);

  }

  document.body.removeChild(ta);
}


function openLink(){

  const url =
    document
      .getElementById("outLink")
      .textContent
      .trim();

  if(
    url &&
    url.indexOf("http") === 0
  ){

    window.location.href = url;

  }
}


async function createAll(){

  const btn =
    document.getElementById("btnCreate");

  btn.disabled = true;

  btn.textContent =
    "Đang tạo Link4M...";

  document
    .getElementById("result")
    .style.display = "none";

  setStatus(
    "Đang tạo Key + Link4M...",
    ""
  );

  try{

    const response =
      await fetch(
        BACKEND_URL + "/create",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({})
        }
      );

    if(!response.ok){

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if(!data.success){

      throw new Error(
        data.error ||
        "Không tạo được Key"
      );

    }

    if(!data.shortUrl){

      throw new Error(
        "Backend không trả Link4M"
      );

    }

    document
      .getElementById("outKey")
      .textContent =
      "Hoàn thành Link4M để nhận Key";

    document
      .getElementById("outLink")
      .textContent =
      data.shortUrl;

    document
      .getElementById("result")
      .style.display =
      "block";

    setStatus(
      "Đã tạo Link4M — đang chuyển...",
      "ok"
    );

    setTimeout(function(){

      window.location.href =
        data.shortUrl;

    },500);

  }catch(error){

    console.error(
      "CREATE ERROR:",
      error
    );

    let msg =
      error.message ||
      String(error);

    if(
      msg.indexOf(
        "Failed to fetch"
      ) >= 0
    ){

      msg =
        "Không kết nối được backend.";

    }

    setStatus(
      msg,
      "err"
    );

    btn.disabled = false;

    btn.textContent =
      "Tạo Key Free";
  }
}

</script></body>
</html>
