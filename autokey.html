<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tạo Key + Link4m</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --card: rgba(255,255,255,0.06);
      --stroke: rgba(255,255,255,0.12);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --blue: #3b82f6;
      --blue2: #2563eb;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(59,130,246,0.25), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(34,197,94,0.12), transparent 50%),
        var(--bg);
    }
    .shell {
      width: 100%;
      max-width: 420px;
    }
    .card {
      background: linear-gradient(160deg, rgba(24,24,27,0.95), rgba(9,9,11,0.98));
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 28px 22px 24px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 25px 50px rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #93c5fd;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.25);
      padding: 5px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-main {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      box-shadow: 0 10px 30px rgba(37,99,235,0.35);
      margin-bottom: 8px;
    }
    .btn-green {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 8px 24px rgba(34,197,94,0.25);
      margin-top: 8px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--stroke);
      margin-top: 8px;
    }
    #status {
      min-height: 22px;
      margin: 14px 0 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--orange);
      white-space: pre-line;
      word-break: break-word;
    }
    #status.err { color: var(--red); }
    #status.ok { color: var(--green); }
    #result { display: none; margin-top: 18px; }
    .block { margin-bottom: 14px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .box {
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 14px;
      font-weight: 700;
      word-break: break-all;
      border: 1px dashed;
    }
    .box.key {
      color: #86efac;
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.35);
    }
    .box.link {
      color: #93c5fd;
      background: rgba(59,130,246,0.08);
      border-color: rgba(59,130,246,0.35);
    }
    .foot {
      margin-top: 18px;
      font-size: 11.5px;
      line-height: 1.55;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <div class="badge">● One-time key</div>
      <h1>Tạo Key Beta</h1>
      <p class="sub">
        Bấm get key để tạo key cho apps.
        Vượt 1 lần dùng app vĩnh viễn.
      </p>

      <button class="btn btn-main" id="btnCreate" onclick="createAll()">Tạo Key Free</button>
      <div id="status">Sẵn sàng tạo..</div>

      <div id="result">
        <div class="block">
          <div class="label">Key (1 lần)</div>
          <div class="box key" id="outKey">—</div>
          <button class="btn btn-green" onclick="copyText('outKey')">Sao chép Key</button>
        </div>
        <div class="block">
          <div class="label">Link4m (gửi user)</div>
          <div class="box link" id="outLink">—</div>
          <button class="btn btn-main" onclick="copyText('outLink')">Sao chép Link4m</button>
          <button class="btn btn-ghost" onclick="openLink()">Mở Link4m</button>
        </div>
      </div>

      <p class="foot">
        make by lovemeizu
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    // ================== CẤU HÌNH (sửa tại đây) ==================
    var LINK4M_API_TOKEN = ""; // ← dán API token Link4m
    var DESTINATION_BASE = "https://ogegaugaw.github.io/ogekeyl4m/get-key.html";
    // ===========================================================

    var firebaseConfig = {
      apiKey: "AIzaSyAhHdsZw5xwq_hmtU_oe9ELSgEw6L6pxvY",
      authDomain: "ogekeyl4m.firebaseapp.com",
      databaseURL: "https://ogekeyl4m-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "ogekeyl4m",
      storageBucket: "ogekeyl4m.firebasestorage.app",
      messagingSenderId: "737277929162",
      appId: "1:737277929162:web:0a75c0f0a447d7ad63f633",
      measurementId: "G-JXG8PS8722"
    };

    function setStatus(msg, type) {
      var el = document.getElementById("status");
      el.textContent = msg;
      el.className = type || "";
    }

    function generateKey() {
      var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
      var s = "meizulover_";
      for (var i = 0; i < 9; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
      return s;
    }

    function copyText(id) {
      var t = document.getElementById(id).textContent;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(t).then(function () {
          setStatus("Đã sao chép!", "ok");
        });
      } else {
        var ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); setStatus("Đã sao chép!", "ok"); }
        catch (e) { alert(t); }
        document.body.removeChild(ta);
      }
    }

    function openLink() {
      var u = document.getElementById("outLink").textContent;
      if (u && u.indexOf("http") === 0) window.open(u, "_blank");
    }

    function shortenWithLink4m(longUrl) {
      var apiUrl =
        "https://link4m.co/api-shorten/v2?api=" +
        encodeURIComponent(LINK4M_API_TOKEN) +
        "&url=" +
        encodeURIComponent(longUrl);
      return fetch(apiUrl, { method: "GET" })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var short =
            (data && data.shortenedUrl) ||
            (data && data.url) ||
            (data && data.short) ||
            (data && data.shorturl);
          if (short) return short;
          throw new Error((data && (data.message || data.error)) || JSON.stringify(data));
        });
    }

    function createAll() {
      if (!LINK4M_API_TOKEN || !String(LINK4M_API_TOKEN).trim()) {
        setStatus("Chưa gắn LINK4M_API_TOKEN trong code", "err");
        return;
      }

      var btn = document.getElementById("btnCreate");
      btn.disabled = true;
      document.getElementById("result").style.display = "none";
      setStatus("Đang tạo key...", "");

      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      } catch (e) {}

      var key = generateKey();
      var dest =
        DESTINATION_BASE +
        (DESTINATION_BASE.indexOf("?") >= 0 ? "&" : "?") +
        "from=link4m&k=" +
        encodeURIComponent(key);

      var db = firebase.database();

      db.ref("keys/" + key)
        .set({ created_at: new Date().toISOString(), used: false })
        .then(function () {
          setStatus("Đang tạo Link4m...", "");
          return shortenWithLink4m(dest);
        })
        .then(function (shortUrl) {
          return db.ref("keys/" + key).update({ link4m: shortUrl }).then(function () {
            return shortUrl;
          });
        })
        .then(function (shortUrl) {
          document.getElementById("outKey").textContent = key;
          document.getElementById("outLink").textContent = shortUrl;
          document.getElementById("result").style.display = "block";
          setStatus("Tạo thành công — gửi Link4m cho user", "ok");
          btn.disabled = false;
        })
        .catch(function (err) {
          btn.disabled = false;
          var msg = (err && err.message) ? err.message : String(err);
          document.getElementById("outKey").textContent = key;
          document.getElementById("result").style.display = "block";

          if (
            msg.indexOf("Failed to fetch") >= 0 ||
            msg.indexOf("NetworkError") >= 0 ||
            msg.indexOf("CORS") >= 0
          ) {
            document.getElementById("outLink").textContent = dest;
            setStatus(
              "Key đã tạo. API bị CORS — ô Link đang là URL đích, rút gọn thủ công trên Link4m.",
              "err"
            );
          } else {
            document.getElementById("outLink").textContent = dest;
            setStatus(msg + "\nKey đã lưu. Có thể rút gọn URL đích trên Link4m.", "err");
          }
        });
    }
  </script>
</body>
</html>
